name: Free Mac Terminal Cloud
on: 
  workflow_dispatch: 

jobs:
  launch-terminal:
    runs-on: macos-latest
    steps:
      # Step 1: Install and configure Ngrok using the secret you saved earlier
      - name: Initialize Tunnel
        run: |
          brew install ngrok
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      # Step 2: Launch the web-accessible terminal panel
      - name: Open Web Terminal
        run: |
          # Starts a lightweight web terminal engine on port 4242
          sudo native-terminal-server --port 4242 &
          sleep 5
          
          # Fire up the Ngrok tunnel over HTTP
          ngrok http 4242 --log=stdout &
          sleep 10

      # Step 3: Automatically post the link as a comment notification
      - name: Post Access URL
        run: |
          # Fetch the public link from Ngrok's local API panel
          TERMINAL_URL=$(curl --silent http://127.0.0 | jq -r '.tunnels[0].public_url')
          
          # Post the link as a direct comment on the workflow run page
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}/comments \
            -d "{\"body\":\"🚀 YOUR CLOUD MAC TERMINAL IS READY!\n\nClick here to open it: $TERMINAL_URL\"}"

      # Step 4: Keep the server open for 6 hours
      - name: Hold Session Open
        run: |
          sleep 21600
