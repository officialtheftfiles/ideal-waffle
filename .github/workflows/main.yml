name: macOS Terminal (SSH + Tailscale)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale auth key (generate a one-time/ephemeral key at login.tailscale.com/admin/settings/keys)"
        required: true
      runtime_minutes:
        description: "Session length in minutes (max 350)"
        required: false
        default: "350"

jobs:
  macos-terminal:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Set random SSH password
        id: genpass
        run: |
          PASS=$(openssl rand -hex 6)
          echo "sshpass=$PASS" >> "$GITHUB_OUTPUT"
          echo "$PASS" | sudo -S true 2>/dev/null || true
          sudo sysadminctl -addUser bulletuser -password "$PASS" -admin 2>&1 || \
          dscl . -create /Users/bulletuser 2>&1 || true

      - name: Create user + set password (fallback method)
        run: |
          PASS="${{ steps.genpass.outputs.sshpass }}"
          if ! id bulletuser &>/dev/null; then
            sudo sysadminctl -addUser bulletuser -fullName "Bullet User" -password "$PASS" -admin
          else
            echo "$PASS" | sudo dscl . -passwd /Users/bulletuser
          fi

      - name: Enable Remote Login (SSH)
        run: |
          sudo systemsetup -setremotelogin on
          sudo dscl . -append /Groups/com.apple.access_ssh GroupMembership bulletuser

      - name: Install Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/tailscale_latest_macos.pkg -o /tmp/ts.pkg
          sudo installer -pkg /tmp/ts.pkg -target /
          sudo tailscaled install-system-daemon
          sleep 3

      - name: Bring up Tailscale
        run: |
          sudo tailscale up \
            --authkey="${{ inputs.ts_authkey }}" \
            --hostname="macos-action-${{ github.run_id }}" \
            --accept-dns=true
          sleep 3
          tailscale ip -4

      - name: Print connection details
        run: |
          IP=$(tailscale ip -4)
          echo "=================================================="
          echo "   macOS TERMINAL READY (via Tailscale + SSH)"
          echo "=================================================="
          echo "Connect using any SSH app (Termux, JuiceSSH, Terminus,"
          echo "or ssh in any terminal):"
          echo ""
          echo "  ssh bulletuser@$IP"
          echo ""
          echo "Username:  bulletuser"
          echo "Password:  ${{ steps.genpass.outputs.sshpass }}"
          echo "=================================================="
          echo "Make sure Tailscale is running/connected on your"
          echo "own device and signed into the SAME Tailscale account."
          echo "=================================================="

      - name: Keep session alive
        run: |
          MINS="${{ inputs.runtime_minutes }}"
          if [ "$MINS" -gt 350 ]; then MINS=350; fi
          sleep $((MINS * 60))
