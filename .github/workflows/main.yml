name: Zero Setup Free Mac GUI
on: 
  workflow_dispatch: 

jobs:
  launch-gui:
    runs-on: macos-latest
    steps:
      # Step 1: Assign user authorization privileges locally 
      - name: Configure Mac User Password
        run: |
          sudo sysadminctl -passwordSecure "password123" -addUserPassword runner

      # Step 2: Grant the runner profile explicit VNC access permissions
      - name: Authorize Remote Desktop Access
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -privs -all -users runner

      # Step 3: Turn on the native Apple Graphical VNC Engine
      - name: Activate Apple VNC Server
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

      # Step 4: Force Pinggy to create a clean TCP port address
      - name: Start Live GUI Stream
        run: |
          echo "=========================================================="
          echo "Generating your visual desktop connection details..."
          echo "=========================================================="
          
          ssh -p 443 -R0:localhost:5900 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 tcp@a.pinggy.io
