name: macOS Terminal (SSH + Tailscale)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale auth key (generate a one-time/ephemeral key at login.tailscale.com/admin/settings/keys)"
        required: true
      runtime_minutes:
        description: "Session length in minutes (max 350)"
        required: false
        default: "350"

jobs:
  macos-terminal:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Create user + set password
        id: genpass
        run: |
          PASS=$(openssl rand -hex 6)
          echo "sshpass=$PASS" >> "$GITHUB_OUTPUT"
          if ! id saprow &>/dev/null; then
            sudo sysadminctl -addUser saprow -fullName "Saprow" -password "$PASS" -admin
          else
            echo "$PASS" | sudo dscl . -passwd /Users/saprow
          fi

      - name: Enable Remote Login (SSH)
        run: |
          sudo systemsetup -setremotelogin on
          sudo dscl . -append /Groups/com.apple.access_ssh GroupMembership saprow

      - name: Install Tailscale via Homebrew
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 3

      - name: Bring up Tailscale
        run: |
          sudo tailscale up \
            --authkey="${{ inputs.ts_authkey }}" \
            --hostname="macos-action-${{ github.run_id }}" \
            --accept-dns=true
          sleep 3
          tailscale ip -4

      - name: Print connection details
        run: |
          IP=$(tailscale ip -4)
          echo "=================================================="
          echo "   macOS TERMINAL READY (via Tailscale + SSH)"
          echo "=================================================="
          echo "ssh saprow@$IP"
          echo ""
          echo "Username:  saprow"
          echo "Password:  ${{ steps.genpass.outputs.sshpass }}"
          echo "=================================================="

      - name: Keep session alive
        run: |
          MINS="${{ inputs.runtime_minutes }}"
          if [ "$MINS" -gt 350 ]; then MINS=350; fi
          sleep $((MINS * 60))
