name: Remote VM (Linux)

on:
  workflow_dispatch:
    inputs:
      ts_authkey:
        description: "Tailscale auth key"
        required: true
      runtime_minutes:
        description: "Session length in minutes (max 350)"
        required: false
        default: "350"

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd curl unzip

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Create default user
        run: |
          sudo useradd -m -s /bin/bash saprow
          sudo usermod -aG sudo saprow
          echo "saprow ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/saprow

          sudo mkdir -p /home/saprow/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" | sudo tee /home/saprow/.ssh/authorized_keys
          sudo chown -R saprow:saprow /home/saprow/.ssh
          sudo chmod 700 /home/saprow/.ssh
          sudo chmod 600 /home/saprow/.ssh/authorized_keys

      - name: Set user password
        run: |
          echo "saprow:${{ secrets.SAPROW_PASSWORD }}" | sudo chpasswd

      - name: Configure rclone for saprow
        run: |
          sudo mkdir -p /home/saprow/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | sudo tee /home/saprow/.config/rclone/rclone.conf > /dev/null
          sudo chown -R saprow:saprow /home/saprow/.config

      - name: Install and connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey "${{ inputs.ts_authkey }}" --hostname "saprow-linux" --accept-dns=true

      - name: Enable SSH
        run: |
          sudo systemctl enable --now ssh

      - name: Find latest backup
        id: check_backup
        run: |
          LAST=$(sudo -u saprow rclone lsf gdrive:vm-backups/ --include "backup_*.tar.zst" 2>/dev/null | \
            sed -E "s/backup_([0-9]+)\.tar\.zst/\1/" | sort -n | tail -1)
          if [ -z "$LAST" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "num=$LAST" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore latest backup
        if: steps.check_backup.outputs.found == 'true'
        run: |
          NUM=$(printf "%02d" "${{ steps.check_backup.outputs.num }}")
          echo "Restoring backup_${NUM}..."
          sudo -u saprow bash -c "
            rclone copy gdrive:vm-backups/backup_${NUM}.tar.zst ~/restore.tar.zst
            rclone copy gdrive:vm-backups/packages_${NUM}.txt ~/packages.txt
            tar --use-compress-program=zstd -xf ~/restore.tar.zst -C ~
          "
          if [ -f /home/saprow/packages.txt ]; then
            sudo apt-get update
            xargs sudo apt-get install -y < /home/saprow/packages.txt
          fi
          if [ -d /home/saprow/Downloads ]; then
            for deb in /home/saprow/Downloads/*.deb; do
              [ -e "$deb" ] && sudo dpkg -i "$deb"
            done
            sudo apt-get install -f -y
          fi

      - name: Show connection info
        run: |
          echo "Backup found: ${{ steps.check_backup.outputs.found }}"
          IP=$(tailscale ip -4)
          echo "=================================================="
          echo "  VM READY — Tailscale IP: $IP"
          echo "  SSH: ssh saprow@$IP"
          echo "=================================================="

      - name: Work session — auto-backup fires at hour 5
        run: |
          TOTAL_MIN="${{ inputs.runtime_minutes }}"
          if [ "$TOTAL_MIN" -gt 350 ]; then TOTAL_MIN=350; fi
          BACKUP_AT=300
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TOTAL_MIN" ]; do
            if [ "$ELAPSED" -eq "$BACKUP_AT" ]; then
              echo "Hour 5 reached — running automatic backup..."
              sudo -u saprow bash -c '
                cd ~
                sudo apt-mark showmanual > ~/packages.txt

                LAST=$(rclone lsf gdrive:vm-backups/ --include "backup_*.tar.zst" | \
                  sed -E "s/backup_([0-9]+)\.tar\.zst/\1/" | sort -n | tail -1)
                if [ -z "$LAST" ]; then NEXT=1; else NEXT=$((10#$LAST + 1)); fi
                NUM=$(printf "%02d" "$NEXT")

                tar --use-compress-program=zstd -cf "backup_${NUM}.tar.zst" \
                  --exclude="**/cache" --exclude="**/Cache" --exclude="**/node_modules" \
                  Documents Downloads Desktop Pictures .config .local/share 2>/dev/null

                rclone copy "backup_${NUM}.tar.zst" gdrive:vm-backups/
                rclone copy ~/packages.txt "gdrive:vm-backups/packages_${NUM}.txt"

                echo "Uploaded backup_${NUM}.tar.zst and packages_${NUM}.txt"
              '
              echo "Automatic backup complete."
            fi
            sleep 60
            ELAPSED=$((ELAPSED + 1))
          done
